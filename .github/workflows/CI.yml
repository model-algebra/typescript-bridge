name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package's type-check and build scripts need vue-tsc (not a dependency)
      # and src/index.ts (missing), so tsc and vitest are run directly
      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm exec vitest run
